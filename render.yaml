services:
  - type: web
    name: railway-rakshak
    env: python
    buildCommand: pip install -r requirements.txt || pip install -r backend/requirements.txt
    startCommand: python3 -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
